<!-- public/logo-cf.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Fundo: círculo escuro -->
  <circle cx="32" cy="32" r="30" fill="#020617" />

  <!-- Anel subtil -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#0f172a" stroke-width="2" />

  <!-- Linha de “fluxo” muito discreta -->
  <path
    d="M18 39 C 24 33, 29 33, 35 36 S 44 40, 46 34"
    fill="none"
    stroke="rgba(248,250,252,0.6)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Monograma CF branco -->
  <text
    x="32"
    y="29"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
    font-size="17"
    font-weight="600"
    fill="#f9fafb"
  >
    CF
  </text>
</svg>
